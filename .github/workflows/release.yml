name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches TOC version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' EmoteHub.toc | head -n 1)"
          if [ "v${version}" != "${TAG_NAME}" ]; then
            echo "Tag ${TAG_NAME} does not match EmoteHub.toc version ${version}" >&2
            exit 1
          fi

      - name: Build release archive
        run: |
          git archive --format=zip --prefix=EmoteHub/ -o EmoteHub.zip HEAD \
            EmoteHub.toc '*.lua' README.md INSTALL.txt LICENSE CHANGELOG.md Textures

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            ./EmoteHub.zip
